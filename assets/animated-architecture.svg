<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGradArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="cardGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes lineFlow {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseRing {
      0%, 100% { opacity: 0.3; r: 16px; }
      50% { opacity: 0.8; r: 20px; }
    }
    .flow-line {
      stroke-dasharray: 10 8;
      animation: lineFlow 2s linear infinite;
    }
    .anim-card-1 { animation: floatY 4s ease-in-out infinite 0.0s; }
    .anim-card-2 { animation: floatY 4s ease-in-out infinite 0.8s; }
    .anim-card-3 { animation: floatY 4s ease-in-out infinite 1.6s; }
    .anim-card-4 { animation: floatY 4s ease-in-out infinite 2.4s; }
    .anim-card-5 { animation: floatY 4s ease-in-out infinite 3.2s; }
    .arch-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Container Box -->
  <rect width="960" height="210" rx="16" fill="url(#bgGradArch)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Data Highway -->
  <line x1="80" y1="105" x2="880" y2="105" stroke="#334155" stroke-width="3" />
  <line class="flow-line" x1="80" y1="105" x2="880" y2="105" stroke="url(#lineGrad)" stroke-width="2.5" />

  <!-- 1. Dashboard -->
  <g transform="translate(28, 42)" class="arch-text">
    <g class="anim-card-1">
      <rect width="164" height="126" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" filter="url(#cardGlow)" />
      <circle cx="82" cy="36" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="82" y="42" text-anchor="middle" font-size="15" fill="#38bdf8">&#9889;</text>
      <text x="82" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Dashboard</text>
      <text x="82" y="93" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Chairside Pulse</text>
      <text x="82" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">1-Tap Triage Queue</text>
    </g>
  </g>

  <!-- 2. Patients -->
  <g transform="translate(214, 42)" class="arch-text">
    <g class="anim-card-2">
      <rect width="164" height="126" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.6" filter="url(#cardGlow)" />
      <circle cx="82" cy="36" r="16" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="82" y="42" text-anchor="middle" font-size="15" fill="#34d399">&#128101;</text>
      <text x="82" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Patient Vault</text>
      <text x="82" y="93" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Odontogram 1-32</text>
      <text x="82" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">FDI &amp; Allergy Alerts</text>
    </g>
  </g>

  <!-- 3. Schedule -->
  <g transform="translate(400, 42)" class="arch-text">
    <g class="anim-card-3">
      <rect width="164" height="126" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.6" filter="url(#cardGlow)" />
      <circle cx="82" cy="36" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="82" y="42" text-anchor="middle" font-size="15" fill="#818cf8">&#128197;</text>
      <text x="82" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Operatory Matrix</text>
      <text x="82" y="93" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Multi-Doctor Chairs</text>
      <text x="82" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">Patient ID Pass</text>
    </g>
  </g>

  <!-- 4. Billing -->
  <g transform="translate(586, 42)" class="arch-text">
    <g class="anim-card-4">
      <rect width="164" height="126" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.6" filter="url(#cardGlow)" />
      <circle cx="82" cy="36" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="82" y="42" text-anchor="middle" font-size="15" fill="#f59e0b">&#129534;</text>
      <text x="82" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Clinical Billing</text>
      <text x="82" y="93" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Tooth-by-Tooth Fees</text>
      <text x="82" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">Direct WhatsApp Bills</text>
    </g>
  </g>

  <!-- 5. Automations -->
  <g transform="translate(772, 42)" class="arch-text">
    <g class="anim-card-5">
      <rect width="164" height="126" rx="14" fill="#0f172a" stroke="#ec4899" stroke-width="1.6" filter="url(#cardGlow)" />
      <circle cx="82" cy="36" r="16" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="82" y="42" text-anchor="middle" font-size="15" fill="#ec4899">&#128172;</text>
      <text x="82" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f8fafc">Automations</text>
      <text x="82" y="93" text-anchor="middle" font-size="10.5" font-weight="500" fill="#94a3b8">Meta WhatsApp Cloud</text>
      <text x="82" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">72% No-Show Drop</text>
    </g>
  </g>
</svg>
